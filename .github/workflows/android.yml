name: Build Android APK

on:
workflow_dispatch:
push:
paths:
- 'SIP_Android_App_Project.zip'
- '.github/workflows/android.yml'

jobs:
build:
runs-on: ubuntu-latest
steps:
- name: Checkout repository
uses: actions/checkout@v4

```
  - name: Set up Java
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - name: Extract Android project
    run: |
      unzip -o SIP_Android_App_Project.zip -d project
      find project -maxdepth 4 -type f | head -100
      echo "Project files extracted"
```
