
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Find and extract project ZIP
        run: |
          ZIP_PATH="$(find . -type f -iname '*.zip' -not -path './.git/*' | head -n 1)"
          if [ -z "$ZIP_PATH" ]; then
            echo "ERROR: No ZIP file found in repository"
            find . -maxdepth 4 -type f
            exit 1
          fi
          echo "Found ZIP: $ZIP_PATH"
          unzip -o "$ZIP_PATH" -d project
          find project -maxdepth 5 -type f

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          PROJECT_DIR="$(find project -type f -name settings.gradle -print -quit | xargs dirname)"
          if [ -z "$PROJECT_DIR" ] || [ ! -f "$PROJECT_DIR/app/build.gradle" ]; then
            echo "ERROR: Android Gradle project not found"
            find project -maxdepth 5 -type f
            exit 1
          fi
          cd "$PROJECT_DIR"
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PersianPhone-APK
          path: project/**/app/build/outputs/apk/debug/app-debug.apk
